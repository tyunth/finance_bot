<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Вход</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 flex items-center justify-center h-screen">
    <div class="bg-white p-8 rounded-2xl shadow-xl w-96">
        <h1 class="text-2xl font-bold mb-6 text-center text-gray-800">Финансы 2.0</h1>
        <form id="login-form" class="space-y-4">
            <input type="text" id="username" placeholder="Логин" class="w-full border p-3 rounded-xl outline-none focus:border-blue-500" required>
            <input type="password" id="password" placeholder="Пароль" class="w-full border p-3 rounded-xl outline-none focus:border-blue-500" required>
            <button type="submit" class="w-full bg-blue-600 text-white p-3 rounded-xl font-bold hover:bg-blue-700 transition">Войти</button>
        </form>
        <p id="error-msg" class="text-red-500 text-center mt-4 text-sm hidden"></p>
    </div>

    <script>
        document.getElementById('login-form').addEventListener('submit', async (e) => {
            e.preventDefault();
            const username = document.getElementById('username').value;
            const password = document.getElementById('password').value;
            const errEl = document.getElementById('error-msg');

            try {
                const res = await fetch('/budzet/auth/login', {
                    method: 'POST',
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify({ username, password })
                });
                const data = await res.json();
                
                if (res.ok) {
                    window.location.href = '/budzet/'; // Переход на главную
                } else {
                    errEl.textContent = data.error || 'Ошибка входа';
                    errEl.classList.remove('hidden');
                }
            } catch (e) {
                errEl.textContent = 'Ошибка сети';
                errEl.classList.remove('hidden');
            }
        });
    </script>
</body>
</html>
